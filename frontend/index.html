<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARDGUARD AI v2.0 - Enterprise Fraud & Document RAG Platform</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- React & Tailwind CDN for Standalone Enterprise UI -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #e2e8f0;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .glass-panel {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s ease-in-out;
    }
    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-2px);
    }
    .bg-grid-pattern {
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="bg-grid-pattern min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const API_BASE = window.location.origin;

    function App() {
      const [activeTab, setActiveTab] = useState("dashboard");
      const [transactionId, setTransactionId] = useState("TXN-00000030");
      const [investigation, setInvestigation] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [metrics, setMetrics] = useState({
        total_investigations: 154,
        successful_investigations: 152,
        failed_investigations: 2,
        documents_processed_doc_ai: 28,
        vertex_search_queries: 84,
        human_approvals: 18,
        human_rejections: 4,
        estimated_cost_usd: 0.048
      });

      const runInvestigation = async (txId) => {
        setLoading(true);
        setError(null);
        try {
          const res = await fetch(`${API_BASE}/v1/investigations`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ transaction_id: txId || transactionId })
          });
          if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
          const data = await res.json();
          setInvestigation(data);
          setActiveTab("investigation");
        } catch (err) {
          setError(err.message);
          setInvestigation(getMockInvestigation(txId || transactionId));
          setActiveTab("investigation");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div class="flex h-screen overflow-hidden">
          <!-- Sidebar Navigation -->
          <aside class="w-64 glass-panel flex flex-col justify-between p-4 border-r border-slate-800">
            <div>
              <!-- Logo -->
              <div class="flex items-center space-x-3 px-2 py-3 mb-6">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-500/30">
                  <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                  <h1 class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">CARDGUARD AI</h1>
                  <p class="text-[10px] text-indigo-400 font-semibold tracking-wider uppercase">v2.0 VERTEX RAG PLATFORM</p>
                </div>
              </div>

              <!-- Nav Links -->
              <nav class="space-y-1">
                {[
                  { id: "dashboard", label: "Dashboard", icon: "fa-chart-pie" },
                  { id: "investigation", label: "Investigation Detail", icon: "fa-magnifying-glass-chart" },
                  { id: "doc_ai", label: "Document AI Inspector", icon: "fa-file-invoice" },
                  { id: "vertex_rag", label: "Vertex AI RAG Search", icon: "fa-brain" },
                  { id: "timeline", label: "Agent Timeline", icon: "fa-clock-rotate-left" },
                  { id: "evidence", label: "Evidence & RAG", icon: "fa-file-contract" },
                  { id: "policies", label: "Corporate Policies", icon: "fa-book" },
                  { id: "cases", label: "Case Queue", icon: "fa-folder-open" },
                  { id: "metrics", label: "System Metrics", icon: "fa-server" }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    class={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all ${
                      activeTab === item.id
                        ? "bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 shadow-sm"
                        : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"
                    }`}
                  >
                    <i class={`fa-solid ${item.icon} w-5 text-center`}></i>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            <!-- Footer User Info -->
            <div class="pt-4 border-t border-slate-800/80">
              <div class="flex items-center space-x-3 px-2">
                <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold text-slate-200">
                  SA
                </div>
                <div class="overflow-hidden">
                  <p class="text-xs font-semibold text-slate-200 truncate">Senior Security Analyst</p>
                  <p class="text-[10px] text-slate-400 truncate">head_security@corp.com</p>
                </div>
              </div>
            </div>
          </aside>

          <!-- Main Content Area -->
          <main class="flex-1 overflow-y-auto p-8">
            <!-- Top Header Bar -->
            <header class="flex items-center justify-between pb-6 mb-8 border-b border-slate-800">
              <div>
                <h2 class="text-2xl font-bold text-white capitalize">{activeTab.replace('_', ' ')} Overview</h2>
                <p class="text-xs text-slate-400 mt-0.5">Real-time Document AI & Vertex RAG fraud intelligence</p>
              </div>

              <!-- Quick Investigation Bar -->
              <div class="flex items-center space-x-3">
                <div class="relative">
                  <i class="fa-solid fa-credit-card absolute left-3 top-3 text-slate-400 text-xs"></i>
                  <input
                    type="text"
                    value={transactionId}
                    onChange={(e) => setTransactionId(e.target.value)}
                    placeholder="Enter Transaction ID (e.g. TXN-00000030)"
                    class="bg-slate-900 border border-slate-700 rounded-lg pl-9 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 w-72 font-mono"
                  />
                </div>
                <button
                  onClick={() => runInvestigation(transactionId)}
                  disabled={loading}
                  class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition-all shadow-lg shadow-indigo-600/30 flex items-center space-x-2"
                >
                  {loading ? <i class="fa-solid fa-spinner fa-spin"></i> : <i class="fa-solid fa-bolt"></i>}
                  <span>Investigate</span>
                </button>
              </div>
            </header>

            {/* TAB CONTENT */}
            {activeTab === "dashboard" && <DashboardView onSelectTx={runInvestigation} metrics={metrics} />}
            {activeTab === "investigation" && <InvestigationView investigation={investigation} loading={loading} />}
            {activeTab === "doc_ai" && <DocumentAIView />}
            {activeTab === "vertex_rag" && <VertexRAGView />}
            {activeTab === "timeline" && <TimelineView investigation={investigation} />}
            {activeTab === "evidence" && <EvidenceView investigation={investigation} />}
            {activeTab === "policies" && <PoliciesView />}
            {activeTab === "cases" && <CasesView onSelectTx={runInvestigation} />}
            {activeTab === "metrics" && <MetricsView metrics={metrics} />}
          </main>
        </div>
      );
    }

    /* Dashboard View */
    function DashboardView({ onSelectTx, metrics }) {
      const recentTxs = [
        { id: "TXN-00000030", amount: "$12,450.00", card: "CARD-9876", merchant: "Dubai Luxury Retail", risk: "CRITICAL", score: 92.5, decision: "BLOCK_PENDING_APPROVAL" },
        { id: "TXN-00000015", amount: "$4,200.00", card: "CARD-4321", merchant: "Apex Tech Outlet", risk: "HIGH", score: 72.0, decision: "ESCALATE" },
        { id: "TXN-00000008", amount: "$180.50", card: "CARD-1122", merchant: "City Gas Station", risk: "LOW", score: 12.0, decision: "CLEAR" }
      ];

      return (
        <div class="space-y-6">
          {/* Top Metric Cards */}
          <div class="grid grid-cols-4 gap-4">
            <MetricCard title="Total Investigations" value={metrics.total_investigations} icon="fa-shield" color="indigo" />
            <MetricCard title="Doc AI Extracted Receipts" value={metrics.documents_processed_doc_ai} icon="fa-file-invoice" color="violet" />
            <MetricCard title="Vertex RAG Grounded Queries" value={metrics.vertex_search_queries} icon="fa-brain" color="emerald" />
            <MetricCard title="Est. Cost (USD)" value={`$${metrics.estimated_cost_usd.toFixed(4)}`} icon="fa-coins" color="amber" />
          </div>

          {/* Recent Anomaly Queue Table */}
          <div class="glass-panel rounded-xl p-6">
            <h3 class="text-lg font-bold text-white mb-4">Real-Time Anomaly Stream</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm">
                <thead class="text-xs uppercase text-slate-400 border-b border-slate-800">
                  <tr>
                    <th class="pb-3">Transaction ID</th>
                    <th class="pb-3">Card ID</th>
                    <th class="pb-3">Merchant</th>
                    <th class="pb-3">Amount</th>
                    <th class="pb-3">Risk Level</th>
                    <th class="pb-3">Risk Score</th>
                    <th class="pb-3">Action</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/60 font-mono text-xs">
                  {recentTxs.map(tx => (
                    <tr key={tx.id} class="hover:bg-slate-800/40 transition-colors">
                      <td class="py-3.5 font-bold text-indigo-400">{tx.id}</td>
                      <td class="py-3.5 text-slate-300">{tx.card}</td>
                      <td class="py-3.5 text-slate-200">{tx.merchant}</td>
                      <td class="py-3.5 text-white font-semibold">{tx.amount}</td>
                      <td class="py-3.5">
                        <span class={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                          tx.risk === "CRITICAL" ? "bg-rose-500/20 text-rose-400 border border-rose-500/30" :
                          tx.risk === "HIGH" ? "bg-amber-500/20 text-amber-400 border border-amber-500/30" :
                          "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30"
                        }`}>
                          {tx.risk}
                        </span>
                      </td>
                      <td class="py-3.5 font-bold text-slate-200">{tx.score}</td>
                      <td class="py-3.5">
                        <button
                          onClick={() => onSelectTx(tx.id)}
                          class="bg-indigo-600/80 hover:bg-indigo-600 text-white px-3 py-1 rounded text-xs transition-all"
                        >
                          Inspect
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function MetricCard({ title, value, icon, color }) {
      return (
        <div class="glass-panel p-5 rounded-xl flex items-center justify-between">
          <div>
            <p class="text-xs font-medium text-slate-400">{title}</p>
            <p class="text-2xl font-extrabold text-white mt-1">{value}</p>
          </div>
          <div class={`w-12 h-12 rounded-xl bg-${color}-500/10 border border-${color}-500/20 flex items-center justify-center text-${color}-400 text-xl`}>
            <i class={`fa-solid ${icon}`}></i>
          </div>
        </div>
      );
    }

    /* Document AI Inspector View */
    function DocumentAIView() {
      const [parsing, setParsing] = useState(false);
      const [result, setResult] = useState({
        document_id: "DOC-REC-PARIS-9921",
        processor_type: "RECEIPT_PROCESSOR",
        vendor_name: "Luxury Electronics Paris",
        total_amount: 12570.00,
        tax_amount: 1005.60,
        discrepancy_flag: true,
        discrepancy_reason: "Receipt extracted total ($12,570.00) exceeds claimed transaction amount ($12,450.00) by $120.00",
        line_items: [
          { description: "High-End Personal Tech Gear", amount: 11000.00 },
          { description: "Express Expedited Delivery Fee", amount: 1570.00 }
        ]
      });

      const handleTestProcess = async () => {
        setParsing(true);
        try {
          const res = await fetch(`${API_BASE}/v1/documents/process`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              document_name: "receipt_paris.png",
              receipt_bytes_hex: "524543454950543a204c757875727920456c656374726f6e696373205061726973",
              expected_amount: 12450.00
            })
          });
          const data = await res.json();
          setResult(data);
        } catch (e) {
          console.error(e);
        } finally {
          setParsing(false);
        }
      };

      return (
        <div class="space-y-6">
          <div class="glass-panel p-6 rounded-xl space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <h3 class="text-lg font-bold text-white flex items-center space-x-2">
                  <i class="fa-solid fa-file-invoice text-indigo-400"></i>
                  <span>Google Cloud Document AI Receipt & OCR Inspector</span>
                </h3>
                <p class="text-xs text-slate-400 mt-1">Multi-modal structured entity extraction with card transaction discrepancy checking</p>
              </div>
              <button
                onClick={handleTestProcess}
                disabled={parsing}
                class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition-all"
              >
                {parsing ? "Parsing via Document AI..." : "Run Receipt OCR Extraction"}
              </button>
            </div>

            {result.discrepancy_flag && (
              <div class="bg-rose-500/10 border border-rose-500/30 p-4 rounded-xl text-xs text-rose-300 flex items-start space-x-3">
                <i class="fa-solid fa-triangle-exclamation text-base mt-0.5"></i>
                <div>
                  <p class="font-bold">INVOICE-TRANSACTION AMOUNT DISCREPANCY DETECTED</p>
                  <p class="mt-1">{result.discrepancy_reason}</p>
                </div>
              </div>
            )}

            <div class="grid grid-cols-3 gap-4 font-mono text-xs">
              <div class="glass-card p-4 rounded-lg space-y-1">
                <p class="text-slate-400">Extracted Vendor</p>
                <p class="font-bold text-white text-sm">{result.vendor_name}</p>
              </div>
              <div class="glass-card p-4 rounded-lg space-y-1">
                <p class="text-slate-400">Extracted Total Amount</p>
                <p class="font-bold text-emerald-400 text-sm">${result.total_amount?.toFixed(2)}</p>
              </div>
              <div class="glass-card p-4 rounded-lg space-y-1">
                <p class="text-slate-400">Document AI Processor</p>
                <p class="font-bold text-indigo-300 text-sm">{result.processor_type}</p>
              </div>
            </div>

            <div class="glass-card p-4 rounded-lg">
              <p class="font-bold text-slate-200 text-xs mb-3">Itemized Line Items ({result.line_items?.length})</p>
              <div class="space-y-2 font-mono text-xs">
                {result.line_items?.map((item, idx) => (
                  <div key={idx} class="flex justify-between border-b border-slate-800 pb-2">
                    <span class="text-slate-300">{item.description}</span>
                    <span class="text-indigo-400 font-bold">${item.amount?.toFixed(2)}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* Vertex AI RAG Search View */
    function VertexRAGView() {
      const [query, setQuery] = useState("international travel expense approval limit over 2500");
      const [loading, setLoading] = useState(false);
      const [ragResult, setRagResult] = useState({
        original_query: "international travel expense approval limit over 2500",
        expanded_queries: [
          "international travel expense approval limit over 2500",
          "Corporate expense policy rule regarding international travel limit",
          "Fraud escalation and threshold compliance for travel limits"
        ],
        hypothetical_doc: "Official Policy Excerpt: International travel card charges exceeding $2,500 require prior VP Finance authorization.",
        grounding_fidelity_score: 0.96,
        citations: [
          { citation_id: 1, title: "Corporate Card International Travel Policy", uri: "gs://cardguard-policies/international_travel.pdf", snippet: "All international transactions exceeding $2,500 must receive prior written authorization..." }
        ]
      });

      const handleRunRAG = async () => {
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/v1/rag/query`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: query, top_k: 4 })
          });
          const data = await res.json();
          setRagResult(data);
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div class="space-y-6">
          <div class="glass-panel p-6 rounded-xl space-y-4">
            <h3 class="text-lg font-bold text-white flex items-center space-x-2">
              <i class="fa-solid fa-brain text-emerald-400"></i>
              <span>Google Vertex AI Search & HyDE Advanced RAG Explorer</span>
            </h3>

            <div class="flex space-x-3">
              <input
                type="text"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm text-slate-200"
              />
              <button
                onClick={handleRunRAG}
                disabled={loading}
                class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-lg"
              >
                {loading ? "Searching Vertex Datastore..." : "Execute HyDE RAG"}
              </button>
            </div>

            <div class="grid grid-cols-2 gap-4 text-xs font-mono">
              <div class="glass-card p-4 rounded-lg space-y-2">
                <p class="font-bold text-indigo-400">Multi-Query Expansion Variations</p>
                {ragResult.expanded_queries?.map((q, idx) => (
                  <p key={idx} class="text-slate-300">[{idx+1}] {q}</p>
                ))}
              </div>
              <div class="glass-card p-4 rounded-lg space-y-2">
                <p class="font-bold text-emerald-400">Grounding Fidelity Score</p>
                <p class="text-2xl font-extrabold text-white">{(ragResult.grounding_fidelity_score * 100).toFixed(0)}%</p>
                <p class="text-[10px] text-slate-400">Grounded against Vertex AI Search Datastore</p>
              </div>
            </div>

            <div class="glass-card p-4 rounded-lg space-y-2 text-xs">
              <p class="font-bold text-amber-400">HyDE (Hypothetical Document Excerpt)</p>
              <p class="text-slate-300 italic">"{ragResult.hypothetical_doc}"</p>
            </div>

            <div class="glass-card p-4 rounded-lg space-y-3 text-xs">
              <p class="font-bold text-slate-200">Retrieved Vertex Search Grounded Citations</p>
              {ragResult.citations?.map((cit, idx) => (
                <div key={idx} class="border-l-2 border-indigo-500 pl-3 py-1 space-y-1">
                  <p class="font-bold text-indigo-300">[{cit.citation_id}] {cit.title}</p>
                  <p class="text-slate-400 text-[10px] font-mono">{cit.uri}</p>
                  <p class="text-slate-300 italic">"{cit.snippet}"</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    /* Investigation View */
    function InvestigationView({ investigation, loading }) {
      if (loading) {
        return (
          <div class="flex flex-col items-center justify-center py-20 space-y-4">
            <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-sm font-medium text-slate-300">Orchestrating multi-agent parallel fraud investigation...</p>
          </div>
        );
      }

      if (!investigation) {
        return <div class="text-slate-400 py-10">Select or enter a transaction ID to start an investigation.</div>;
      }

      return (
        <div class="space-y-6">
          <div class="glass-panel p-6 rounded-xl flex items-center justify-between border-l-4 border-indigo-500">
            <div>
              <div class="flex items-center space-x-3">
                <span class="text-xs font-mono bg-slate-800 text-slate-300 px-2.5 py-1 rounded border border-slate-700">Case ID: {investigation.case_id}</span>
                <span class={`px-3 py-1 rounded-full text-xs font-extrabold ${
                  investigation.risk_level === "CRITICAL" ? "bg-rose-500/20 text-rose-400 border border-rose-500/40" : "bg-amber-500/20 text-amber-400"
                }`}>
                  {investigation.risk_level} RISK (Score: {investigation.risk_score})
                </span>
              </div>
              <h3 class="text-xl font-bold text-white mt-2">Recommended Action: {investigation.decision}</h3>
              <p class="text-xs text-slate-400 mt-1">Audit Trail ID: <span class="font-mono text-slate-300">{investigation.audit_id}</span></p>
            </div>

            {investigation.human_approval_required && (
              <div class="flex items-center space-x-3">
                <button class="bg-rose-600 hover:bg-rose-500 text-white font-bold px-4 py-2 rounded-lg text-sm shadow-lg shadow-rose-600/30">
                  <i class="fa-solid fa-lock mr-2"></i> Approve Block
                </button>
                <button class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold px-4 py-2 rounded-lg text-sm border border-slate-700">
                  Reject & Clear
                </button>
              </div>
            )}
          </div>

          <div class="grid grid-cols-3 gap-6">
            <div class="glass-panel p-5 rounded-xl space-y-3">
              <h4 class="font-bold text-white text-sm flex items-center space-x-2">
                <i class="fa-solid fa-bolt text-amber-400"></i>
                <span>Fraud Signals ({investigation.fraud_signals?.length || 0})</span>
              </h4>
              <div class="space-y-2">
                {investigation.fraud_signals?.map((sig, idx) => (
                  <div key={idx} class="glass-card p-3 rounded-lg text-xs space-y-1">
                    <div class="flex justify-between items-center">
                      <span class="font-bold text-amber-400">{sig.signal_type}</span>
                      <span class="text-slate-400 font-mono">+{sig.score_impact} pts</span>
                    </div>
                    <p class="text-slate-300">{sig.description}</p>
                  </div>
                ))}
              </div>
            </div>

            <div class="glass-panel p-5 rounded-xl space-y-3">
              <h4 class="font-bold text-white text-sm flex items-center space-x-2">
                <i class="fa-solid fa-quote-left text-indigo-400"></i>
                <span>Grounded Policy Citations</span>
              </h4>
              <div class="space-y-2">
                {investigation.citations?.map((cit, idx) => (
                  <div key={idx} class="glass-card p-3 rounded-lg text-xs space-y-1">
                    <p class="font-bold text-indigo-300">{cit.document_name} ({cit.section_title})</p>
                    <p class="text-slate-300 italic">"{cit.clause_text}"</p>
                  </div>
                ))}
              </div>
            </div>

            <div class="glass-panel p-5 rounded-xl space-y-3">
              <h4 class="font-bold text-white text-sm flex items-center space-x-2">
                <i class="fa-solid fa-id-card text-emerald-400"></i>
                <span>Context Profiles</span>
              </h4>
              <div class="glass-card p-3 rounded-lg text-xs space-y-1">
                <p class="font-semibold text-slate-200">Merchant Profile</p>
                <p class="text-slate-400">{investigation.merchant_findings?.[0]?.merchant_name}</p>
                <p class="text-slate-400">MCC: {investigation.merchant_findings?.[0]?.notes}</p>
              </div>
              <div class="glass-card p-3 rounded-lg text-xs space-y-1">
                <p class="font-semibold text-slate-200">Employee Profile</p>
                <p class="text-slate-400">Dept: {investigation.employee_findings?.[0]?.department}</p>
                <p class="text-slate-400">Limit: ${investigation.employee_findings?.[0]?.single_tx_limit}</p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function TimelineView({ investigation }) {
      return (
        <div class="glass-panel p-6 rounded-xl space-y-4">
          <h3 class="text-lg font-bold text-white">Agent Collaboration Timeline</h3>
          <div class="border-l-2 border-indigo-500 pl-4 space-y-6">
            <div class="relative">
              <div class="absolute -left-[21px] top-1 w-3 h-3 rounded-full bg-indigo-500"></div>
              <p class="text-xs font-bold text-indigo-400">00.0s - Supervisor Agent</p>
              <p class="text-sm text-slate-200">Initiated parallel fan-out to Fraud, Policy, Merchant, Employee sub-agents.</p>
            </div>
            <div class="relative">
              <div class="absolute -left-[21px] top-1 w-3 h-3 rounded-full bg-emerald-500"></div>
              <p class="text-xs font-bold text-emerald-400">00.2s - Document AI & Vertex RAG</p>
              <p class="text-sm text-slate-200">Parsed receipt OCR entities & retrieved grounded Vertex Search citations.</p>
            </div>
            <div class="relative">
              <div class="absolute -left-[21px] top-1 w-3 h-3 rounded-full bg-amber-500"></div>
              <p class="text-xs font-bold text-amber-400">00.4s - Deterministic Decision Engine</p>
              <p class="text-sm text-slate-200">Evaluated v1.2.0 rules. Computed Risk Score = 92.5. Requires Human Approval.</p>
            </div>
          </div>
        </div>
      );
    }

    function EvidenceView({ investigation }) {
      return (
        <div class="glass-panel p-6 rounded-xl">
          <h3 class="text-lg font-bold text-white mb-4">Evidence Graph & RAG Artifacts</h3>
          <p class="text-xs text-slate-400">All evidence claims are verified against Document AI receipts and policy vector chunks.</p>
        </div>
      );
    }

    function PoliciesView() {
      return (
        <div class="glass-panel p-6 rounded-xl">
          <h3 class="text-lg font-bold text-white mb-4">Corporate Policy Document Directory</h3>
          <p class="text-xs text-slate-400">Indexed in Google Vertex AI Search Datastore.</p>
        </div>
      );
    }

    function CasesView({ onSelectTx }) {
      return (
        <div class="glass-panel p-6 rounded-xl">
          <h3 class="text-lg font-bold text-white mb-4">Human Approval & Case Review Queue</h3>
          <p class="text-xs text-slate-400">Cases requiring human analyst authorization prior to high-risk write actions.</p>
        </div>
      );
    }

    function MetricsView({ metrics }) {
      return (
        <div class="glass-panel p-6 rounded-xl space-y-4">
          <h3 class="text-lg font-bold text-white">System Observability & Latency Percentiles</h3>
          <div class="grid grid-cols-3 gap-4 font-mono text-xs">
            <div class="glass-card p-4 rounded-lg">
              <p class="text-slate-400">P50 Latency</p>
              <p class="text-xl font-bold text-indigo-400 mt-1">115 ms</p>
            </div>
            <div class="glass-card p-4 rounded-lg">
              <p class="text-slate-400">P95 Latency</p>
              <p class="text-xl font-bold text-amber-400 mt-1">310 ms</p>
            </div>
            <div class="glass-card p-4 rounded-lg">
              <p class="text-slate-400">P99 Latency</p>
              <p class="text-xl font-bold text-rose-400 mt-1">520 ms</p>
            </div>
          </div>
        </div>
      );
    }

    function getMockInvestigation(txId) {
      return {
        case_id: `CASE-${txId.replace('TXN-', '')}`,
        transaction_id: txId,
        risk_level: "CRITICAL",
        risk_score: 92.5,
        decision: "BLOCK_PENDING_APPROVAL",
        reason_codes: ["R001", "R002", "R003"],
        fraud_signals: [
          { signal_type: "amount_anomaly", description: "Transaction $12,450 exceeds limit $5,000", score_impact: 30.0 },
          { signal_type: "merchant_risk", description: "High risk MCC 6051 Crypto/Wire", score_impact: 40.0 },
          { signal_type: "geographic_anomaly", description: "Cross-border transaction in Dubai", score_impact: 25.0 }
        ],
        citations: [
          { document_name: "corporate_card_policy.pdf", section_title: "3.1 Transaction Limits", clause_text: "Single transaction limit for standard employees is $5,000 USD." }
        ],
        merchant_findings: [{ merchant_name: "Dubai Luxury Retail", notes: "MCC 6051 in AE" }],
        employee_findings: [{ department: "Sales", single_tx_limit: 5000.0 }],
        human_approval_required: true,
        audit_id: "AUDIT-MOCK-998877"
      };
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
