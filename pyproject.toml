[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cardguard-ai"
version = "2.0.0"
description = "Enterprise Corporate Card Fraud Investigation & Decision Intelligence Platform v2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "google-genai",
    "google-cloud-bigquery",
    "google-cloud-pubsub",
    "google-cloud-storage",
    "google-cloud-secret-manager",
    "google-cloud-documentai",
    "google-cloud-discoveryengine",
    "google-cloud-logging",
    "google-cloud-trace",
    "google-cloud-monitoring",
    "mcp",
    "httpx",
    "jinja2",
    "numpy",
    "pandas",
    "scikit-learn",
    "pypdf",
    "python-multipart"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "black",
    "ruff",
    "mypy"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
